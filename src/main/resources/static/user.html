<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználói oldal</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#06b6d4);
        }

        .card{
            background:white;
            width:450px;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .avatar{
            width:100px;
            height:100px;
            margin:auto;
            border-radius:50%;
            background:#4f46e5;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            font-weight:bold;
            margin-bottom:20px;
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        p{
            color:#666;
            font-size:18px;
            margin-bottom:30px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#ef4444;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#dc2626;
        }

    </style>
</head>
<body>

<div class="card">

    <div class="avatar" id="avatar"></div>

    <h1>Üdvözöllek!</h1>

    <p id="welcome"></p>

    <button onclick="logout()">
        Kijelentkezés
    </button>

</div>

<script>

    const user = localStorage.getItem("user");
    if(!user){
        window.location.href = "/";
    }
    document.getElementById("welcome").innerText =
        "Bejelentkezve: " + user;

    document.getElementById("avatar").innerText =
        user ? user.charAt(0).toUpperCase() : "?";

    function logout() {

        localStorage.removeItem("user");

        window.location.href = "/";
    }

</script>

</body>
</html>
